<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glows -->
    <radialGradient id="purple-ambient" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orange-ambient" cx="60%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-ambient" cx="30%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Main Cyber Gradient across Monogram -->
    <linearGradient id="cyberGrad" x1="15%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="32%" stop-color="#3B82F6" />
      <stop offset="68%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.35" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Flare Filter for Corner Highlights -->
    <filter id="flareGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Black Background (#09090B) -->
  <rect width="800" height="800" fill="#09090B" />
  <circle cx="350" cy="350" r="340" fill="url(#cyan-ambient)" />
  <circle cx="380" cy="420" r="320" fill="url(#purple-ambient)" />
  <circle cx="500" cy="460" r="300" fill="url(#orange-ambient)" />

  <!-- ── Circuit & Architectural Trace Micro-Details ── -->
  <g stroke="url(#traceGrad)" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left node and traces -->
    <path d="M 180 230 L 250 230 L 290 280" />
    <circle cx="180" cy="230" r="4" fill="#06B6D4" />

    <!-- Bottom-left tech bus -->
    <path d="M 130 590 L 210 590 L 245 540" />
    <circle cx="130" cy="590" r="4" fill="#3B82F6" />

    <!-- Top-right network branch -->
    <path d="M 670 230 L 610 230 L 570 280" />
    <circle cx="670" cy="230" r="4" fill="#8B5CF6" />

    <!-- Right-side bracket circuit -->
    <path d="M 690 415 L 635 415 L 610 395" />
    <circle cx="690" cy="415" r="4" fill="#F97316" />

    <!-- Bottom-right data bus -->
    <path d="M 660 590 L 595 590 L 565 545" />
    <circle cx="660" cy="590" r="4" fill="#F97316" />
  </g>

  <!-- ── Centered Standalone "AB" Monogram ── -->
  <g filter="url(#neonGlow)">
    <!-- 
      Centered Geometric Fusion:
      - 'A': Sharp tech chevron upward angle, solid stance, clean geometry.
      - 'B': Fused central spine with syntax brackets `<` & `{}` seamlessly carved into curves.
    -->

    <!-- Left Leg of 'A' (Sharp upward tech angle) -->
    <path d="
      M 370 190 
      L 402 190 
      L 242 610 
      L 182 610 
      Z" 
      fill="url(#cyberGrad)" 
    />

    <!-- Apex Tech Peak Accent (A's top cap) -->
    <path d="
      M 370 190 
      L 402 190 
      L 426 248 
      L 348 248 
      Z" 
      fill="#06B6D4" 
      opacity="0.95"
    />

    <!-- Middle Shared Crossbar / Code Bridge -->
    <path d="
      M 285 435 
      L 500 435 
      L 476 482 
      L 266 482 
      Z" 
      fill="url(#cyberGrad)" 
    />

    <!-- Central Vertical Backbone of 'B' (Fused with right downward slope of 'A') -->
    <path d="
      M 402 190 
      L 456 190 
      L 456 610 
      L 402 610 
      Z" 
      fill="url(#cyberGrad)" 
    />

    <!-- 'B' Top Lobe (Stylized Code Bracket `<` & `{}` Curve) -->
    <path d="
      M 456 190 
      L 542 190 
      C 602 190  638 232  638 290 
      C 638 348  598 395  538 408 
      L 456 408 
      Z
      M 504 242 
      L 504 355 
      L 535 355 
      C 568 355 588 330 588 298 
      C 588 266 568 242 535 242 
      Z" 
      fill="url(#cyberGrad)" 
      fill-rule="evenodd" 
    />

    <!-- 'B' Lower Lobe (Expanded Bracket `{}` Geometry with Dynamic Angle) -->
    <path d="
      M 456 398 
      L 550 398 
      C 612 398  658 444  658 506 
      C 658 568  606 610  540 610 
      L 456 610 
      Z
      M 504 450 
      L 504 558 
      L 540 558 
      C 575 558 606 538 606 504 
      C 606 470 575 450 540 450 
      Z" 
      fill="url(#cyberGrad)" 
      fill-rule="evenodd" 
    />

    <!-- Syntax Code Bracket `<` Accent inside Upper Lobe -->
    <path d="
      M 552 280 
      L 535 298 
      L 552 316" 
      fill="none" 
      stroke="#06B6D4" 
      stroke-width="5.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.95"
    />

    <!-- Syntax Code Bracket `>` Accent inside Lower Lobe -->
    <path d="
      M 560 486 
      L 578 506 
      L 560 526" 
      fill="none" 
      stroke="#F97316" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.95"
    />
  </g>

  <!-- ── Luminous Spark / Corner Flare Accents ── -->
  <g filter="url(#flareGlow)">
    <!-- Apex Flare on A -->
    <circle cx="386" cy="190" r="5.5" fill="#FFFFFF" />
    <path d="M 386 172 L 386 208 M 368 190 L 404 190" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Upper B Corner Flare -->
    <circle cx="456" cy="190" r="4.5" fill="#06B6D4" />

    <!-- Central Bridge Junction Flare -->
    <circle cx="456" cy="403" r="5" fill="#FFFFFF" />
    <path d="M 456 390 L 456 416 M 443 403 L 469 403" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

    <!-- Outer Bracket Peak Flare -->
    <circle cx="638" cy="290" r="4.5" fill="#8B5CF6" />

    <!-- Bottom Right Base Flare -->
    <circle cx="540" cy="610" r="5" fill="#F97316" />
    <path d="M 540 598 L 540 622 M 528 610 L 552 610" stroke="#F97316" stroke-width="2" stroke-linecap="round" />

    <!-- Left Base Foot Flare -->
    <circle cx="182" cy="610" r="4" fill="#06B6D4" />
  </g>
</svg>
